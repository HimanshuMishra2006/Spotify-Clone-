<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Style Search Bar</title>
  <style>
    /* Styling the background to match Spotify's dark theme */
    body {
      background-color: #000000;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* The main search bar container */
    .search-container {
      display: flex;
      align-items: center;
      background-color: #1f1f1f;
      border-radius: 500px; /* Gives it the pill/capsule shape */
      padding: 0 16px;
      width: 450px;
      height: 48px;
      border: 1px solid transparent;
      transition: background-color 0.2s, border-color 0.2s;
    }

    /* Subtle hover effect */
    .search-container:hover {
      background-color: #2f2a2f;
      border-color: #333;
    }

    /* Style for the SVG icons */
    .icon {
      fill: #c4f80c;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor:pointer;
    }

    /* The actual text input field */
    .search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      padding: 0 12px;
    }

    /* Styling the placeholder text */
    .search-input::placeholder {
      color: #757575;
      font-size: 1rem;
    }

    /* The vertical line divider on the right side */
    .divider {
      width: 1px;
      height: 24px;
      background-color: #3e3e3e;
      margin-right: 12px;
    }

    .browse-btn:hover .icon {
      fill: #ffffff;
      transform: scale(1.04);
    }
  </style>
</head>
<body>

  <div class="search-container">
    <!-- Left Side: Search Icon -->
    <div class="icon">
      <svg height="20" width="20" viewBox="0 0 24 24">
        <path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 1 0 1.414-1.414l-4.344-4.344a9.157 9.157 0 0 0 2.077-5.816c0-5.14-4.226-9.28-9.407-9.28zm-7.407 9.279c0-4.006 3.302-7.279 7.407-7.279s7.407 3.273 7.407 7.279-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.279z"></path>
      </svg>
    </div>

    <!-- Center: Input Box -->
    <input type="text" class="search-input" placeholder="What do you want to play?">

    <!-- Right Side: Divider -->
    <div class="divider"></div>

    <!-- Right Side: Browse/Box Icon button -->
    <div class="browse-btn">
      <div class="icon">
        <svg height="24" width="24" viewBox="0 0 24 24">
          <path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5zm2 0v2h14V5H5zm14 4H5v10h14V9zM7 12h10v2H7v-2z"></path>
        </svg>
      </div>
    </div>
  </div>

</body>
</html>
